services:
  db:
    image: mysql:8.0
    container_name: pathocore_api_db
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pathocore_api
      MYSQL_USER: django
      MYSQL_PASSWORD: djangopass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "6606:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - pathocore_api_db_data:/var/lib/mysql

  app:
    container_name: pathocore_api_app
    build:
      context: .
      args:
        GIT_REVISION: ${GIT_REVISION:-develop}
        INSTALL_CONF: ${INSTALL_CONF:-conf/docker_test_settings.txt}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: 8000
      APP_INSTALL_PATH: /opt/pathocore-api
      APP_REPO_PATH: /srv/pathocore-api
      APP_READY_FILE: /opt/pathocore-api/.container_install_ready
      DATABROWSER_CACHE_SCHEDULER_ENABLED: ${DATABROWSER_CACHE_SCHEDULER_ENABLED:-true}
      # Python weekday: Monday=0, Friday=4.
      DATABROWSER_CACHE_REFRESH_WEEKDAY: ${DATABROWSER_CACHE_REFRESH_WEEKDAY:-4}
      DATABROWSER_CACHE_REFRESH_TIME: ${DATABROWSER_CACHE_REFRESH_TIME:-12:00}
      DATABROWSER_CACHE_REFRESH_ON_START: ${DATABROWSER_CACHE_REFRESH_ON_START:-false}
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - pathocore_api_documents:/opt/pathocore-api/documents
      - pathocore_api_logs:/opt/pathocore-api/logs
      - pathocore_api_static:/opt/pathocore-api/static

volumes:
  pathocore_api_db_data:
  pathocore_api_documents:
  pathocore_api_logs:
  pathocore_api_static:
